<svg viewBox="0 0 680 466" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mapping native methods to libraries: JNI plus JNA/FFI native methods from bytecode analysis, with the container's .so files and binaries, feed mapped_updated.py, which resolves methods by JNI symbol match (JNI), RegisterNatives recovery (JNI_DYNAMIC), or JNA/JNR/FFM binding; output records carry a library, c-symbol and tag, with INTRINSIC, PLATFORM_EXCLUDED and NOT_FOUND_IN_LIBS classifications, and feed binary analysis with SysPart.">
  <style>
    .title{font-weight:500;font-size:15px;fill:#1a1a18}
    .th{font-weight:500;font-size:13px}
    .t{font-weight:400;font-size:13px}
    .ts{font-weight:400;font-size:11px}
    .gray &gt; rect{fill:#f2f2ef;stroke:#c9c8c2;stroke-width:1.2}
    .gray text{fill:#3a3a37}
    .teal &gt; rect{fill:#e1f5ee;stroke:#1d9e75;stroke-width:1.2}
    .teal text{fill:#0a3f33}
    .purple &gt; rect{fill:#eeedfe;stroke:#534ab7;stroke-width:1.2}
    .purple text{fill:#2a2470}
    .arr{stroke:#8c8c86;stroke-width:1.5;fill:none}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <rect x="1" y="1" width="678" height="464" rx="10" fill="#ffffff" stroke="#e6e6e1"/>

  <text x="340" y="26" text-anchor="middle" class="title">mapping native methods to libraries</text>

  <g class="gray"><rect x="64" y="44" width="248" height="50" rx="8"/>
  <text x="188" y="69" text-anchor="middle" class="th">JNI + JNA/FFI native methods</text>
  <text x="188" y="86" text-anchor="middle" class="ts">from bytecode analysis</text></g>

  <g class="gray"><rect x="368" y="44" width="248" height="50" rx="8"/>
  <text x="492" y="69" text-anchor="middle" class="th">container .so files + binaries</text>
  <text x="492" y="86" text-anchor="middle" class="ts">libjvm · libjava · libnetty · libjffi …</text></g>

  <line class="arr" x1="188" y1="94" x2="270" y2="139" marker-end="url(#arrow)"/>
  <line class="arr" x1="492" y1="94" x2="410" y2="139" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="20" y="140" width="640" height="124" rx="10"/>
  <text x="340" y="160" text-anchor="middle" class="th">mapped_updated.py — resolution by evidence</text></g>

  <g class="purple"><rect x="32" y="174" width="192" height="76" rx="8"/>
  <text x="128" y="196" text-anchor="middle" class="th">JNI symbol match</text>
  <text x="128" y="214" text-anchor="middle" class="ts">Java_* exported symbols</text>
  <text x="128" y="232" text-anchor="middle" class="ts">[JNI]</text></g>

  <g class="purple"><rect x="244" y="174" width="192" height="76" rx="8"/>
  <text x="340" y="196" text-anchor="middle" class="th">RegisterNatives</text>
  <text x="340" y="214" text-anchor="middle" class="ts">JNINativeMethod[] in binaries</text>
  <text x="340" y="232" text-anchor="middle" class="ts">[JNI_DYNAMIC]</text></g>

  <g class="purple"><rect x="456" y="174" width="192" height="76" rx="8"/>
  <text x="552" y="196" text-anchor="middle" class="th">JNA · JNR · FFM</text>
  <text x="552" y="214" text-anchor="middle" class="ts">binding-site resolution</text>
  <text x="552" y="232" text-anchor="middle" class="ts">[JNA] [JNR] [FFM]</text></g>

  <line class="arr" x1="340" y1="264" x2="340" y2="285" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="110" y="286" width="460" height="92" rx="8"/>
  <text x="340" y="308" text-anchor="middle" class="th">mapped_method_syscalls.txt</text>
  <text x="340" y="328" text-anchor="middle" class="ts">resolved:  lib.so : method → c_symbol  [JNI · JNI_DYNAMIC · JNA]</text>
  <text x="340" y="345" text-anchor="middle" class="ts">classified:  [INTRINSIC] · PLATFORM_EXCLUDED · NOT_FOUND_IN_LIBS</text>
  <text x="340" y="364" text-anchor="middle" class="ts">e.g.  Native.timerFd → netty_epoll_native_timerFd  [JNI_DYNAMIC]</text></g>

  <line class="arr" x1="340" y1="378" x2="340" y2="414" marker-end="url(#arrow)"/>

  <g class="gray"><rect x="225" y="415" width="230" height="36" rx="18"/>
  <text x="340" y="438" text-anchor="middle" class="t">binary analysis (SysPart)</text></g>
</svg>
